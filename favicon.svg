<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 100">
  <!-- Tradox Global "D D O" mark, matching logo.png -->
  <g fill="#4A90E2">
    <!-- Left "D": flat left edge, rounded right -->
    <path d="M 10 10 A 40 40 0 0 1 10 90 Z"/>
    <!-- Middle "D": flat left edge, rounded right -->
    <path d="M 65 10 A 40 40 0 0 1 65 90 Z"/>
    <!-- Right "O": full circle -->
    <circle cx="160" cy="50" r="40"/>
  </g>
</svg>
